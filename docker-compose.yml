name: bookstore-devops

services:
  # ============================================
  # Woodpecker CI (Server & Agent)
  # ============================================
  woodpecker-server:
    image: woodpeckerci/woodpecker-server:v3
    container_name: woodpecker-server
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - WOODPECKER_OPEN=true
      - WOODPECKER_HOST=${WOODPECKER_HOST:-http://localhost:8000}
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:-bookstore-devops-secret-key-12345}
      - WOODPECKER_GITHUB=true
    volumes:
      - woodpecker-data:/var/lib/woodpecker
    networks:
      - devops

  woodpecker-agent:
    image: woodpeckerci/woodpecker-agent:v3
    container_name: woodpecker-agent
    command: agent
    environment:
      - WOODPECKER_SERVER=woodpecker-server:9000
      - WOODPECKER_AGENT_SECRET=${WOODPECKER_AGENT_SECRET:-bookstore-devops-secret-key-12345}
      - WOODPECKER_MAX_WORKERS=2
      - DOCKER_HOST=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      woodpecker-server:
        condition: service_started
    networks:
      - devops

volumes:
  woodpecker-data:

networks:
  devops:
    driver: bridge
